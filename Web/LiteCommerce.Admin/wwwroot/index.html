<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CommerceAdmin</title>
    <base href="/" />

    <!-- MudBlazor CSS -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Quill.js (Rich Text Editor) -->
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet" />

    <!-- App CSS -->
    <link href="css/app.css" rel="stylesheet" />
    <link href="CommerceAdmin.styles.css" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Applies the saved language before Blazor boots, so the shell text and <html lang> match. -->
    <script>
        (function () {
            try {
                var settings = JSON.parse(localStorage.getItem('app-settings') || '{}');
                document.documentElement.lang = settings.Language || 'vi-VN';
            } catch (e) {
                document.documentElement.lang = 'vi-VN';
            }
        })();
    </script>
</head>

<body>
    <div id="app">
        <div style="display:flex; align-items:center; justify-content:center; height:100vh; flex-direction:column; font-family:'Nunito', sans-serif">
            <div style="width:48px; height:48px; border:4px solid #594AE2; border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:16px"></div>
            <span id="app-loading-text" style="color:#594AE2; font-weight:600; font-size:16px">Đang tải...</span>
        </div>
        <script>
            if (document.documentElement.lang.toLowerCase().indexOf('en') === 0) {
                document.getElementById('app-loading-text').textContent = 'Loading...';
            }
        </script>
        <style>
            @keyframes spin {
                to {
                    transform: rotate(360deg)
                }
            }
        </style>
    </div>

    <div id="blazor-error-ui" style="display:none">
        <span id="blazor-error-text">Lỗi không mong muốn xảy ra.</span> <a href="" class="reload" id="blazor-error-reload">Tải lại trang</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
        if (document.documentElement.lang.toLowerCase().indexOf('en') === 0) {
            document.getElementById('blazor-error-text').textContent = 'An unexpected error has occurred.';
            document.getElementById('blazor-error-reload').textContent = 'Reload page';
        }
    </script>

    <!-- Quill.js (Rich Text Editor) -->
    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.js"></script>
    <script src="_content/Blazored.TextEditor/Blazored-BlazorQuill.js"></script>
    <script src="js/app.js"></script>

    <!-- MudBlazor JS -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
